[project]
name = "multidimensional-chart-calculator"
version = "0.1.0"
description = "Python-based astrological and Human Design calculation engine with offline geographic lookup."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pyswisseph>=2.10.3,<3.0",
    "uvicorn>=0.32,<1.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
